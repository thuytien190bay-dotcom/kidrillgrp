<svg xmlns="http://www.w3.org/2000/svg" viewBox="195 25 330 330" width="512" height="512" fill="none">
  <defs>
    <!-- Copper / Bronze Mineral Gradients (Upper curves) -->
    <linearGradient id="bronzeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f5af7a" />
      <stop offset="35%" stopColor="#d97736" />
      <stop offset="70%" stopColor="#b45309" />
      <stop offset="100%" stopColor="#78350f" />
    </linearGradient>

    <linearGradient id="bronzeDeep" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#c26c30" />
      <stop offset="45%" stopColor="#8d3d17" />
      <stop offset="85%" stopColor="#451a03" />
      <stop offset="100%" stopColor="#1e1008" />
    </linearGradient>

    <!-- Deep Ocean Teal & Emerald Agriculture Gradients (Lower curves) -->
    <linearGradient id="tealBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2dd4bf" />
      <stop offset="35%" stopColor="#0d9488" />
      <stop offset="70%" stopColor="#0f766e" />
      <stop offset="100%" stopColor="#134e4a" />
    </linearGradient>

    <linearGradient id="tealDeep" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#0f766e" />
      <stop offset="40%" stopColor="#042f2e" />
      <stop offset="80%" stopColor="#082032" />
      <stop offset="100%" stopColor="#020d1a" />
    </linearGradient>

    <!-- Vertical Stem Gradient: transition from mineral bronze down into deep ocean teal -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#b45309" />
      <stop offset="35%" stopColor="#78350f" />
      <stop offset="55%" stopColor="#1e293b" />
      <stop offset="75%" stopColor="#0f766e" />
      <stop offset="100%" stopColor="#042f2e" />
    </linearGradient>

    <!-- Ribbon Highlight Glare -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.45" />
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#0f172a" floodOpacity="0.16" />
    </filter>
  </defs>

  <!-- Group: Sculptural Ribbon "K" Emblem Only (No text below) -->
  <g filter="url(#subtleShadow)">
    <!-- 1. Left Vertical Stem with Serifs -->
    <!-- Base shadow layer of stem -->
    <path d="M 220 50 C 260 50, 280 65, 275 105 L 275 270 C 275 320, 255 335, 220 335 L 295 335 C 290 300, 290 90, 295 50 Z" fill="#020d1a" opacity="0.4" />
    <!-- Main Stem Body with organic flow -->
    <path d="M 215 50 C 265 50, 285 70, 280 115 L 280 265 C 280 315, 255 335, 215 335 L 295 335 C 285 300, 285 85, 295 50 Z" fill="url(#stemGrad)" />
    <!-- Left highlight contour of stem -->
    <path d="M 235 52 C 265 52, 280 72, 278 115 L 278 265 C 278 305, 260 330, 235 332 C 248 318, 256 295, 256 265 L 256 115 C 256 85, 248 65, 235 52 Z" fill="url(#glareGrad)" />

    <!-- 2. Bottom-Right Leg (Marine / Emerald Ribbon Sweep) -->
    <!-- Deep under-shadow of bottom arm -->
    <path d="M 275 200 C 285 240, 310 270, 365 305 C 410 330, 460 340, 500 338 C 450 330, 400 300, 355 260 C 315 225, 290 195, 275 200 Z" fill="url(#tealDeep)" />
    <!-- Main Sweeping Marine Leaf Ribbon -->
    <path d="M 280 205 C 310 215, 340 255, 395 295 C 440 328, 480 338, 505 338 C 455 325, 415 285, 370 240 C 330 200, 305 185, 280 205 Z" fill="url(#tealBright)" />
    <!-- Secondary inner fold of marine wing -->
    <path d="M 330 245 C 365 280, 410 315, 475 335 C 440 325, 400 295, 360 255 C 335 230, 310 215, 300 215 C 310 225, 320 235, 330 245 Z" fill="url(#tealDeep)" opacity="0.75" />
    <path d="M 300 210 C 340 230, 380 275, 450 325 C 420 310, 385 270, 345 235 Z" fill="url(#glareGrad)" />

    <!-- 3. Top-Right Arm (Mineral / Bronze Ribbon Sweep) -->
    <!-- Deep under-shadow of top arm -->
    <path d="M 275 195 C 290 150, 320 110, 380 70 C 430 40, 480 48, 500 52 C 450 62, 400 100, 355 145 C 315 185, 290 195, 275 195 Z" fill="url(#bronzeDeep)" />
    <!-- Main Sweeping Bronze Mineral Ribbon -->
    <path d="M 280 190 C 300 145, 330 100, 390 65 C 435 40, 475 48, 500 52 C 455 68, 410 110, 365 155 C 325 195, 298 198, 280 190 Z" fill="url(#bronzeLight)" />
    <!-- Upper inner fold shadow -->
    <path d="M 320 150 C 355 110, 400 75, 465 52 C 430 65, 385 105, 345 150 C 320 180, 300 185, 290 185 C 300 170, 310 160, 320 150 Z" fill="url(#bronzeDeep)" opacity="0.65" />
    <!-- Upper crest highlight -->
    <path d="M 345 125 C 390 85, 440 60, 490 53 C 450 62, 410 95, 365 140 Z" fill="url(#glareGrad)" />

    <!-- Central Sculptural Nexus: Where mineral bronze meets marine teal -->
    <path d="M 265 150 C 295 165, 315 195, 300 230 C 285 220, 275 190, 265 150 Z" fill="#3b1d0c" opacity="0.5" />
    <path d="M 275 170 C 290 180, 300 200, 290 220 C 280 210, 275 195, 275 170 Z" fill="url(#bronzeLight)" opacity="0.6" />
  </g>
</svg>
